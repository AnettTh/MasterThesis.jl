[dependencies]
cmake = "*"
ninja = "*"
openssl = ">=3, <3.6"
uv = ">=0.4"
gfortran = "*"

    [dependencies.python]
    channel = "conda-forge"
    build = "*cp*"
    version = ">=3.10,!=3.14.0,!=3.14.1,<4, 3.11.*"

[workspace]
name = ".CondaPkg"
platforms = ["win-64"]
channels = ["conda-forge"]
channel-priority = "strict"
description = "automatically generated by CondaPkg.jl"

[pypi-dependencies]
pymsis = ">=0.12,<0.13"

    [pypi-dependencies.iri2020]
    url = "https://github.com/space-physics/iri2020/archive/refs/heads/main.zip"
