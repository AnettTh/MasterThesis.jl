[dependencies]
cmake = "*"
ninja = "*"
libstdcxx = ">=3.4,<15.0"
openssl = ">=3, <3.6"
libstdcxx-ng = ">=3.4,<15.0"
uv = ">=0.4"
gfortran = "*"

    [dependencies.python]
    channel = "conda-forge"
    build = "*cp*"
    version = "3.11.*, >=3.10,!=3.14.0,!=3.14.1,<4"

[workspace]
name = ".CondaPkg"
platforms = ["linux-64"]
channels = ["conda-forge"]
channel-priority = "strict"
description = "automatically generated by CondaPkg.jl"

[pypi-dependencies]
pymsis = ">=0.12,<0.13"

    [pypi-dependencies.iri2020]
    url = "https://github.com/space-physics/iri2020/archive/refs/heads/main.zip"
